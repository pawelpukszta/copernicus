name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      # Fails on an AA breach; prints the distance to AAA as advisory output.
      # Set CONTRAST_LEVEL=aaa here to make the AAA thresholds blocking.
      - name: Contrast budget (WCAG 1.4.3 AA, AAA advisory)
        run: pnpm run check:contrast

      # Fails when 'use client' appears outside src/components, which is how a
      # client bundle grows without anyone noticing.
      - name: Client/server boundary
        run: pnpm run check:boundary

      # Fails when design/component-exports.generated.md no longer matches the
      # installed react-aria-components version.
      - name: Component inventory freshness
        run: pnpm run design:inventory:check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # After the build on purpose: Next generates next-env.d.ts, which references
      # types under .next/types, so a standalone tsc run cannot resolve them first.
      # `next build` type-checks the project too; this catches what its flags skip.
      - name: TypeScript
        run: pnpm run typecheck

  accessibility:
    name: Accessibility AA (axe + keyboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # A11Y_LEVEL defaults to aa: AAA findings are reported, not enforced.
      - name: Accessibility test suite
        run: pnpm run test:a11y

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
